name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Coverage (core paths, >=70%)
        run: pnpm test:coverage

      - name: strictNullChecks ratchet
        run: pnpm nullcheck

      - name: Build
        run: pnpm build

      - name: Bundle size
        run: pnpm size

      - name: UMD smoke test
        run: pnpm verify-umd

      - name: Verify publish tarballs
        run: pnpm verify-pack

      - name: Node catalog freshness
        run: pnpm docs:nodes:check

      - name: Docs build (zh + en)
        run: pnpm docs:build
