name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Coverage (core paths, >=70%)
        run: pnpm test:coverage

      - name: strictNullChecks ratchet
        run: pnpm nullcheck

      - name: Build
        run: pnpm build

      - name: Bundle size
        run: pnpm size

      - name: Demo smoke test (headless Chrome)
        run: pnpm demo:smoke -- --screenshots

      - name: Upload demo screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-screenshots
          path: artifacts/demo-smoke
          if-no-files-found: ignore

      - name: UMD smoke test
        run: pnpm verify-umd

      - name: Verify publish tarballs
        run: pnpm verify-pack

      - name: Node catalog freshness
        run: pnpm docs:nodes:check

      - name: Docs build (zh + en)
        run: pnpm docs:build

  specs:
    # OpenSpec CLI 要求 Node >= 22.20，与 check 的 Node 20 分开跑；用 pnpm dlx 临时拉取，不进入依赖
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate OpenSpec specs and changes
        run: pnpm spec:validate

  deploy:
    # 只在 master 上的 push / 手动触发时发布，且必须等 check 与 specs 全绿
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [check, specs]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Pages artifacts (demo + bilingual docs + landing page)
        run: pnpm pages:build

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
